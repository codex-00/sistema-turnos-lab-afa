spring.application.name=Proyecto_LaboSoftw
server.port=8081

# Base de datos H2 en memoria, apropiada para el trabajo practico.
spring.datasource.url=jdbc:h2:mem:LABORABD
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.encoding=UTF-8

# Encoding HTTP y mensajes.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8

# Consola web de H2: http://localhost:8081/h2-console
spring.h2.console.enabled=true

# Estudios PDF: H2 guarda metadata; los PDFs se almacenan en disco.
labo.estudios.storage-directory=uploads/estudios
labo.estudios.max-file-size=100MB
labo.estudios.allowed-mime-types=application/pdf
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Mail: SMTP para recuperación de contraseña (Mailtrap demo).
labo.mail.enabled=true
labo.mail.from=labo-afa@noreply.local
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
