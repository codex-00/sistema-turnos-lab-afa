# Perfil de desarrollo: habilita envio real de mail via Mailtrap.
# Levantar con: SPRING_PROFILES_ACTIVE=dev MAIL_USER=<user> MAIL_PASS=<pass> mvn spring-boot:run
# Las credenciales se obtienen en https://mailtrap.io (Email Sandbox -> Inboxes -> Show Credentials).
labo.mail.enabled=true
labo.mail.from=labo-afa@noreply.local

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
